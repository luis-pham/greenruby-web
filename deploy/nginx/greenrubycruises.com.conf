# /etc/nginx/conf.d/greenrubycruises.com.conf
# Template: deploy/install-nginx.sh replaces __PREVIEW_TOKEN__ (kept only on the server).
#
# Public pages are served by Next.js (green-ruby-web, 127.0.0.1:3130) or by the Laravel Blade site
# (green-ruby-cms, 127.0.0.1:8082) depending on $gr_next_live:
#   0 = Laravel for everyone; Next only for browsers holding the preview cookie
#       (open https://greenrubycruises.com/__preview?t=<token>, leave with /__preview?off=1)
#   1 = Next for everyone (go-live). Roll back by setting it to 0 and reloading Nginx.
# CMS, APIs, uploads, image thumbnails, sitemaps and payment pages always go to Laravel.

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=2g inactive=60m use_temp_path=off;

map $cookie_gr_preview $gr_preview {
    default 0;
    "__PREVIEW_TOKEN__" 1;
}

map "$gr_preview" $gr_next_live {
    default 0;   # <- set to 1 to go live
}

map "$gr_next_live$gr_preview" $gr_frontend {
    default http://127.0.0.1:8082;
    "01"    http://127.0.0.1:3130;
    "10"    http://127.0.0.1:3130;
    "11"    http://127.0.0.1:3130;
}

# Previewers must never get pages indexed from their session.
map $gr_preview $gr_preview_robots {
    default "";
    1       "noindex, nofollow";
}

# HTTP -> HTTPS
server {
    listen 80 default_server;
    server_name greenrubycruises.com www.greenrubycruises.com;
    return 301 https://greenrubycruises.com$request_uri;
}

# HTTPS www -> non-www
server {
    listen 443 ssl http2;
    server_name www.greenrubycruises.com;
    ssl_certificate /etc/letsencrypt/live/greenrubycruises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenrubycruises.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://greenrubycruises.com$request_uri;
}

# HTTPS main
server {
    listen 443 ssl http2;
    server_name greenrubycruises.com;
    client_max_body_size 250M;

    ssl_certificate /etc/letsencrypt/live/greenrubycruises.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/greenrubycruises.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # --- Other app on this domain (unchanged) ---
    location = /slogan {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }
    location ^~ /slogan/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_buffering off;
    }

    # --- Preview switch ---
    location = /__preview {
        add_header X-Robots-Tag "noindex, nofollow" always;
        if ($arg_off) {
            add_header Set-Cookie "gr_preview=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Lax" always;
            return 302 /;
        }
        if ($arg_t = "__PREVIEW_TOKEN__") {
            add_header Set-Cookie "gr_preview=__PREVIEW_TOKEN__; Path=/; Max-Age=1209600; Secure; HttpOnly; SameSite=Lax" always;
            return 302 /;
        }
        return 404;
    }

    # --- Next.js build assets (immutable, hashed) ---
    location ^~ /_next/ {
        proxy_pass http://127.0.0.1:3130;
    }

    # --- Always Laravel: CMS, APIs, media, sitemaps, payment pages, Blade assets ---
    location ^~ /admincp { proxy_pass http://127.0.0.1:8082; }
    location ^~ /api/ { proxy_pass http://127.0.0.1:8082; }
    location ^~ /upload/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ^~ /thumbnail/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location ^~ /payment/ { proxy_pass http://127.0.0.1:8082; }
    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
    }
    location ~ ^/sitemap[^/]*\.xml$ { proxy_pass http://127.0.0.1:8082; }

    # Remaining static files (Laravel public/ files such as /js, /css, /favicon) keep the old cache rule.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|mp4|pdf|woff2?)$ {
        proxy_pass http://127.0.0.1:8082;
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # --- Public pages: Next.js or Laravel depending on the switch above ---
    location / {
        proxy_pass $gr_frontend;
        # proxy_set_header here replaces (not extends) the server-level list, so repeat it.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        add_header X-Robots-Tag $gr_preview_robots always;
    }
}
